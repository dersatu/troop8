    <p>Welcome to Boy Scout Troop 8 in Chatham, New Jersey. We're dedicated to helping young people grow through outdoor adventure, leadership, service, and the values of Scouting.</p>

    <h3>About the Troop</h3>
    <p>Troop 8 meets weekly at Ogden Memorial Presbyterian Church in Chatham. We focus on outdoor skills, merit badges, service projects, and community involvement. Scouts of all ages are welcome!</p>
